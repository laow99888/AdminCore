# 生产可选加固：叠加在基础编排（及 realtime）之后、发布清单之前。
# /tmp 有界；大文件/Office 预览项目须按实测调整容量和资源预算。
x-python-hardening: &python-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=256m,mode=1777

services:
  backend:
    <<: *python-hardening
    environment:
      XDG_RUNTIME_DIR: /tmp
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${BACKEND_CPU_LIMIT:-2}
  worker:
    <<: *python-hardening
    mem_limit: ${WORKER_MEMORY_LIMIT:-2g}
    cpus: ${WORKER_CPU_LIMIT:-2}
  beat:
    <<: *python-hardening
    mem_limit: ${BEAT_MEMORY_LIMIT:-256m}
    cpus: ${BEAT_CPU_LIMIT:-0.5}
  frontend:
    read_only: true
    cap_drop: [ALL]
    # 官方 nginx 入口以 root 初始化后降权；仅保留该流程需要的能力。
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /etc/nginx/conf.d:size=8m
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-1}
  db:
    mem_limit: ${DB_MEMORY_LIMIT:-2g}
    cpus: ${DB_CPU_LIMIT:-2}
  redis:
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    cpus: ${REDIS_CPU_LIMIT:-1}
