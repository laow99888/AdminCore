# AdminCore 前端 Nginx 配置：SPA 静态托管 + API 反向代理
# HTTPS 必须由明确配置的可信入口设置；默认忽略客户端伪造的协议头。
map "$remote_addr:$http_x_forwarded_proto" $admincore_forwarded_proto {
    default $scheme;
    "${TRUSTED_PROXY_IP}:https" https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 52m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存（带内容哈希的文件名）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API / 管理后台 / 媒体文件 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $admincore_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $admincore_forwarded_proto;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $admincore_forwarded_proto;
    }

    location /media/ {
        return 404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
