# AdminCore 前端 Nginx 配置：SPA 静态托管 + API 反向代理
# HTTPS 必须由明确配置的可信入口设置；默认忽略客户端伪造的协议头。
map "$realip_remote_addr:$http_x_forwarded_proto" $admincore_forwarded_proto {
    default $scheme;
    "${TRUSTED_PROXY_IP}:https" https;
}

# Docker DNS 动态刷新，后端容器重建更换 IP 后无需重启前端。
upstream admincore_backend {
    zone admincore_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    server backend:8000 resolve;
}

upstream admincore_realtime {
    zone admincore_realtime 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    server ${REALTIME_UPSTREAM} resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 52m;
    set_real_ip_from ${TRUSTED_PROXY_IP};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # SPA 不执行内联脚本；组件动态样式需允许 inline style。
    include /etc/nginx/security-headers.conf;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存（带内容哈希的文件名）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/spa-csp.conf;
        try_files $uri =404;
    }

    # API / 管理后台 / 媒体文件 反向代理到后端
    # 模块 worker 必须使用 JavaScript MIME，不能退回 application/octet-stream。
    location ~ ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/spa-csp.conf;
        try_files $uri =404;
    }

    location = /api/v1/realtime/events/ {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_pass http://admincore_realtime;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $admincore_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 35s;
        proxy_send_timeout 10s;
        client_max_body_size 1k;
    }

    location /api/ {
        # 安全头在代理层统一发送一次，避免上游与 add_header 重复叠加失效。
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_pass http://admincore_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $admincore_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://admincore_backend;
        # 保留端口，使 Django CSRF 的 Origin 校验与外部浏览器地址一致。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $admincore_forwarded_proto;
    }

    location /static/ {
        proxy_pass http://admincore_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $admincore_forwarded_proto;
    }

    location /media/ {
        return 404;
    }

    # SPA 路由回退
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/spa-csp.conf;
        try_files $uri $uri/ /index.html;
    }
}
