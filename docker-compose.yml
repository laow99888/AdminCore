# AdminCore 完整编排：PostgreSQL + Redis + 后端 + Celery worker/beat + 前端
# 使用：docker compose up -d --build
# 首次启动自动迁移并初始化权限和管理员（必须提供 ADMINCORE_ADMIN_PASSWORD）

name: admincore

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-admincore}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # PostgreSQL 18+ 建议挂载父目录（数据实际位于子目录，便于 pg_upgrade）
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-admincore}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "False"
      DRF_NUM_PROXIES: "1"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
      - logs:/app/logs
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "False"
      DRF_NUM_PROXIES: "1"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - media:/app/media
      - logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy

  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "False"
      DRF_NUM_PROXIES: "1"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A config beat -l info --scheduler apps.core.module_scheduler.ModuleScheduler
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-127.0.0.1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
  staticfiles:
  logs:
