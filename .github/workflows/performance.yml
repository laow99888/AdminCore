name: HTTP性能回归
on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/nginx*'
      - 'docker-compose.yml'
      - 'scripts/validate_http_performance.py'
      - 'scripts/tests/test_http_performance.py'
      - '.github/workflows/performance.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/nginx*'
      - 'docker-compose.yml'
      - 'scripts/validate_http_performance.py'
      - 'scripts/tests/test_http_performance.py'
      - '.github/workflows/performance.yml'
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: http-performance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  http-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: python -m pytest -q scripts/tests/test_http_performance.py
      - run: python scripts/validate_http_performance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-performance-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-http-performance-*/report.json
            .codex-validation/admincore-http-performance-*/samples-*.json
            .codex-validation/admincore-http-performance-*/docker.log
