name: 依赖漏洞扫描
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '25 19 * * 0'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - name: 安装固定版本 pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - name: 扫描生产 Python 锁文件
        run: pip-audit -r backend/requirements.lock --strict --format json --output audit-python-production.json
      - name: 扫描开发 Python 锁文件
        if: success() || failure()
        run: pip-audit -r backend/requirements.dev.lock --strict --format json --output audit-python-development.json
      - uses: actions/setup-node@v7
        if: success() || failure()
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 扫描 Node 生产与开发依赖
        if: success() || failure()
        run: npm install -g npm@11.19.0 && npm ci && npm audit --audit-level=high --json > audit-node.json
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit-reports
          path: |
            audit-python-*.json
            frontend/audit-node.json
