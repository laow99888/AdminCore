name: 项目检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: npm install -g npm@11.19.0 && npm ci && npm run sdk:check && npm run test:typecheck && npm test -- tests/sdk.test.ts
        working-directory: frontend
      - run: python -m pytest -q scripts/tests/test_sdk_export.py
  demo-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: python -m pytest -q scripts/tests/test_demo_project.py
      - run: python scripts/validate_demo.py --ref HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-isolation-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-demo-*/report.json
            .codex-validation/admincore-demo-*/docker.log
            .codex-validation/admincore-demo-*/project-start.log
  minimal-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.19.0 && npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: ADMINCORE_BUILD_PROFILE=minimal npm run build && npm run check:bundle
        working-directory: frontend
      - run: python scripts/validate_minimal_build.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: minimal-build-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-minimal-build-*/report.json
            .codex-validation/admincore-minimal-build-*/browser-*-report.json
            .codex-validation/admincore-minimal-build-*/contract.log
            .codex-validation/admincore-minimal-build-*/minimal-build-*.png
            .codex-validation/admincore-minimal-build-*/minimal-build-*.zip
  project-template:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: python scripts/check_ai_docs.py
      - run: python -m pytest -q scripts/tests/test_ai_docs.py
      - run: python -m pytest -q scripts/tests/test_create_project.py scripts/tests/test_project_upgrade.py scripts/tests/test_validate_project_upgrades.py
      - run: python scripts/validate_project_template.py
      - run: python scripts/validate_project_upgrades.py --output .codex-validation/project-upgrades-django-ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: project-template-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-project-template-*/report.json
            .codex-validation/admincore-project-template-*/*.log
            .codex-validation/project-upgrades-django-ci/report.json
            .codex-validation/project-upgrades-django-ci/*.log
  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: python -m pytest -q scripts/tests/test_prepare_release.py
      - run: python scripts/validate_release.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-artifact-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-release-*/report.json
            .codex-validation/admincore-release-*/docker.log
            .codex-validation/admincore-release-*/release/*
  api-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: python scripts/validate_api_lifecycle.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-lifecycle-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-api-lifecycle-*/report.json
            .codex-validation/admincore-api-lifecycle-*/docker.log
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python scripts/check_dependency_locks.py
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: python scripts/check_production.py
      - run: python -m pytest -q scripts/tests/test_dependency_locks.py
  local-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.19.0 && npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/validate_local_exports.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-exports-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-local-exports-*/report.json
            .codex-validation/admincore-local-exports-*/browser-*-report.json
            .codex-validation/admincore-local-exports-*/workbook-report.json
            .codex-validation/admincore-local-exports-*/contract.log
            .codex-validation/admincore-local-exports-*/local-export-*.png
            .codex-validation/admincore-local-exports-*/local-export-*.zip
            .codex-validation/admincore-local-exports-*/*.xlsx
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.19.0
      - run: node --test scripts/browser_session_api.test.mjs
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/validate_codegen.py
      - run: python scripts/validate_codegen_v2.py --postgres --browser
      - run: python scripts/validate_codegen_v2.py --integrations --business-io --postgres --browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codegen-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-codegen-*/report.json
            .codex-validation/admincore-codegen-*/browser-report.json
            .codex-validation/admincore-codegen-*/contract.log
            .codex-validation/admincore-codegen-*/generated-*.png
            .codex-validation/admincore-codegen-*/generated-*.zip
            .codex-validation/codegen-v2-*/report.json
            .codex-validation/codegen-v2-*/runtime-coverage.json
            .codex-validation/codegen-v2-*/*.log
            .codex-validation/codegen-v2-*/browser-*-report.json
            .codex-validation/codegen-v2-*/browser-report.json
            .codex-validation/codegen-v2-*/v2-*.png
            .codex-validation/codegen-v2-*/v2-*.zip
            .codex-validation/codegen-v2-*/v3-*.png
            .codex-validation/codegen-v2-*/v3-*.zip
            .codex-validation/codegen-v2-*/io-*.png
            .codex-validation/codegen-v2-*/io-*.csv
            .codex-validation/codegen-v2-*/reports-*.png
            .codex-validation/codegen-v2-*/organization-*.png
            .codex-validation/codegen-v2-*/integration.xml
  online-forms-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: npm install -g npm@11.19.0 && npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/validate_online_forms_v2.py --postgres
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: online-forms-v2-evidence
          include-hidden-files: true
          path: |
            .codex-validation/online-forms-v2-*/report.json
            .codex-validation/online-forms-v2-*/browser-report.json
            .codex-validation/online-forms-v2-*/*.log
            .codex-validation/online-forms-v2-*/*.png
            .codex-validation/online-forms-v2-*/*.zip
            .codex-validation/online-forms-v2-*/*-definition.json
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: python scripts/validate_example.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: example-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-example-*/report.json
            .codex-validation/admincore-example-*/docker.log
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: python -m pytest -q scripts/tests/test_realtime_capacity.py && python scripts/validate_realtime.py --include-capacity-edge --include-capacity-burst
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: realtime-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-realtime-*/report.json
            .codex-validation/admincore-realtime-*/capacity-*-report.json
            .codex-validation/admincore-realtime-*/burst/capacity-*-report.json
            .codex-validation/admincore-realtime-*/docker.log
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: python scripts/validate_backup.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backup-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-backup-*/report.json
            .codex-validation/admincore-backup-*/docker.log
            .codex-validation/admincore-backup-*/restore.log
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.19.0 && npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m pytest -q scripts/tests/test_image_capacity.py && python scripts/validate_images.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-images-*/report.json
            .codex-validation/admincore-images-*/browser-report.json
            .codex-validation/admincore-images-*/contract.log
            .codex-validation/admincore-images-*/capacity-*-report.json
            .codex-validation/admincore-images-*/images-*.png
            .codex-validation/admincore-images-*/images-*.zip
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: python scripts/validate_storage.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storage-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-storage-*/report.json
            .codex-validation/admincore-storage-*/contract.log
            .codex-validation/admincore-storage-*/minio.log
            .codex-validation/admincore-storage-*/junit.xml
  clamav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - name: 拉取固定 ClamAV 镜像
        run: docker pull clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
      - name: 启动本作业 ClamAV
        run: |
          docker run -d --name admincore-clamav-ci -p 127.0.0.1:3310:3310 \
            clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
          for i in $(seq 1 90); do docker exec admincore-clamav-ci clamdscan --ping 1:2 && exit 0 || sleep 2; done
          docker logs admincore-clamav-ci
          exit 1
      - name: 运行真实引擎 clean/EICAR 验收
        run: python scripts/validate_clamav.py --port 3310
      - name: 清理 ClamAV
        if: always()
        run: docker rm -f admincore-clamav-ci
  office-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OFFICE_REGISTRY_CONTAINER: admincore-office-registry-${{ github.run_id }}-${{ github.run_attempt }}
      OFFICE_CI_OWNER: office-preview-${{ github.run_id }}-${{ github.run_attempt }}
      OFFICE_IMAGE_TAG: 127.0.0.1:18590/admincore-office:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - name: 启动本作业专属回环镜像仓库
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name "$OFFICE_REGISTRY_CONTAINER" \
            --label "io.admincore.office-ci=$OFFICE_CI_OWNER" \
            --publish 127.0.0.1:18590:5000 registry:3.0.0
          timeout 45s curl --fail --silent --show-error --noproxy 127.0.0.1 \
            --retry 30 --retry-all-errors --retry-max-time 40 --retry-delay 1 \
            --connect-timeout 2 --max-time 3 http://127.0.0.1:18590/v2/ > /dev/null
      - name: 构建固定LibreOffice包并取得真实仓库摘要
        id: converter
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag "$OFFICE_IMAGE_TAG" office-converter
          docker push "$OFFICE_IMAGE_TAG"
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          digests = json.loads(subprocess.run(
              ['docker', 'image', 'inspect', os.environ['OFFICE_IMAGE_TAG'],
               '--format', '{{json .RepoDigests}}'],
              check=True, capture_output=True, text=True, timeout=30).stdout)
          matches = [value for value in digests if re.fullmatch(
              r'127\.0\.0\.1:18590/admincore-office@sha256:[a-f0-9]{64}', value)]
          assert len(matches) == 1, '必须取得本次push的RepoDigest，不能使用image ID'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('image=' + matches[0] + '\n')
          PY
      - name: 六格式真实HTTP队列与隔离转换验收
        env:
          OFFICE_REVIEWED_IMAGE: ${{ steps.converter.outputs.image }}
        run: python scripts/validate_office_preview.py --image "$OFFICE_REVIEWED_IMAGE" --ref HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: office-preview-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-office-*/report.json
            .codex-validation/admincore-office-*/runner.log
            .codex-validation/admincore-office-*/project-start.log
      - name: 清理本作业镜像仓库和匿名卷
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect "$OFFICE_REGISTRY_CONTAINER" > /dev/null 2>&1; then
            owner=$(docker container inspect "$OFFICE_REGISTRY_CONTAINER" \
              --format '{{index .Config.Labels "io.admincore.office-ci"}}')
            test "$owner" = "$OFFICE_CI_OWNER"
            docker container rm --force --volumes "$OFFICE_REGISTRY_CONTAINER"
          else
            docker info > /dev/null
          fi
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: testing
      DJANGO_SECRET_KEY: ci-test-only-ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r requirements.dev.lock
        working-directory: backend
      - run: python -m compileall -q apps config && python -m flake8 apps config
        working-directory: backend
      # 业务导入必须在真实安装的生成模块中运行；两套用例合并后执行原有90%门禁。
      - run: python -m pytest --cov=apps --cov-fail-under=0 --cov-report=term-missing
        working-directory: backend
      - run: python scripts/validate_codegen_v2.py --integrations --business-io --postgres --coverage-all --keep
      - run: python -m coverage combine --append --keep ../.codex-validation/codegen-v2-*/.coverage && python -m coverage report --fail-under=90 && python -m coverage xml -o coverage.xml && python -m coverage json -o coverage.json && python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
        working-directory: backend
      - run: python -m pytest -q scripts/tests/test_backup_runner.py scripts/tests/test_office_preview_runner.py scripts/tests/test_office_preview_fixtures.py scripts/tests/test_codegen_installation.py scripts/tests/test_office_preview_validation_http.py
      - run: python scripts/validate_audit_fixes.py
      - run: python scripts/validate_feature_flags.py
      - run: python scripts/validate_ip_policy.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-fixes-postgres-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-audit-fixes-*/
            .codex-validation/admincore-flags-*/
            .codex-validation/admincore-ip-policy-*/
            backend/coverage.xml
            backend/coverage.json
            .codex-validation/codegen-v2-*/report.json
            .codex-validation/codegen-v2-*/integration.log
            .codex-validation/codegen-v2-*/integration.xml
            .codex-validation/codegen-v2-*/runtime-coverage.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.19.0
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend
      - run: npm run test:typecheck && node node_modules/vue-tsc/bin/vue-tsc.js --noEmit -p docs/tsconfig.json && npm run test:coverage && npm run check:bundle
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - run: npm run build && npx playwright test e2e/microfrontends.spec.ts
        working-directory: frontend
        env:
          ADMINCORE_MICRO_FRONTENDS_ENABLED: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: frontend-failure-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
  browser-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r backend/requirements.dev.lock
      - run: npm install -g npm@11.19.0 && npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/validate_browser_session.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-session-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-browser-session-*/report.json
            .codex-validation/admincore-browser-session-*/browser-report.json
            .codex-validation/admincore-browser-session-*/sso-browser-report.json
            .codex-validation/admincore-browser-session-*/browser-session-desktop.png
            .codex-validation/admincore-browser-session-*/browser-session-mobile.png
  p2-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.19.0 && npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/validate_p2_pages.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p2-pages-evidence
          include-hidden-files: true
          path: |
