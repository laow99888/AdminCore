name: 项目检查
on: [push, pull_request]
jobs:
  project-template:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pytest -q scripts/tests/test_create_project.py
      - run: python scripts/validate_project_template.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-template-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-project-template-*/report.json
            .codex-validation/admincore-project-template-*/*.log
  api-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python scripts/validate_api_lifecycle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-lifecycle-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-api-lifecycle-*/report.json
            .codex-validation/admincore-api-lifecycle-*/docker.log
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python scripts/check_dependency_locks.py
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pytest -q scripts/tests/test_dependency_locks.py
  local-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.19.0 && npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/validate_local_exports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-exports-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-local-exports-*/report.json
            .codex-validation/admincore-local-exports-*/browser-*-report.json
            .codex-validation/admincore-local-exports-*/workbook-report.json
            .codex-validation/admincore-local-exports-*/contract.log
            .codex-validation/admincore-local-exports-*/local-export-*.png
            .codex-validation/admincore-local-exports-*/local-export-*.zip
            .codex-validation/admincore-local-exports-*/*.xlsx
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.19.0
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/validate_codegen.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegen-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-codegen-*/report.json
            .codex-validation/admincore-codegen-*/browser-report.json
            .codex-validation/admincore-codegen-*/contract.log
            .codex-validation/admincore-codegen-*/generated-*.png
            .codex-validation/admincore-codegen-*/generated-*.zip
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python scripts/validate_example.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-example-*/report.json
            .codex-validation/admincore-example-*/docker.log
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python scripts/validate_realtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realtime-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-realtime-*/report.json
            .codex-validation/admincore-realtime-*/docker.log
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python scripts/validate_backup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-backup-*/report.json
            .codex-validation/admincore-backup-*/docker.log
            .codex-validation/admincore-backup-*/restore.log
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.19.0 && npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/validate_images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-images-*/report.json
            .codex-validation/admincore-images-*/browser-report.json
            .codex-validation/admincore-images-*/contract.log
            .codex-validation/admincore-images-*/images-*.png
            .codex-validation/admincore-images-*/images-*.zip
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python scripts/validate_storage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-storage-*/report.json
            .codex-validation/admincore-storage-*/contract.log
            .codex-validation/admincore-storage-*/minio.log
            .codex-validation/admincore-storage-*/junit.xml
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: testing
      DJANGO_SECRET_KEY: ci-test-only-ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r requirements.lock
        working-directory: backend
      - run: python -m pytest && python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
        working-directory: backend
      - run: python -m pytest -q scripts/tests/test_backup_runner.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.19.0
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend
      - run: npm run test:typecheck && npm run test:coverage && npm run check:bundle
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-failure-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python scripts/validate_foundation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-contract-evidence
          include-hidden-files: true
          path: |
            .codex-validation/admincore-foundation-*/report.json
            .codex-validation/admincore-foundation-*/docker.log
