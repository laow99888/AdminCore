version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      compatible-packages:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # 官方原包独立校验来源、许可证和摘要，不能切回 npm 旧版。
      - dependency-name: xlsx
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '03:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      compatible-packages:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    # requirements.lock 由 uv 生成；机器人若未同步锁文件，CI 会阻断并要求维护者轮转。
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      workflow-actions:
        patterns: ['*']
